<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN Dashboard — вход</title>
<style>
  :root { --bg:#0e1626; --card:#152036; --text:#e4ebf5; --muted:#8696b0; --line:#24334f; --field:#1b2843; --accent:#3d8bfd; --bad:#f0596b; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg:#f2f5fa; --card:#fff; --text:#1b2433; --muted:#68758a; --line:#e2e8f2; --field:#f6f8fc; --accent:#2b74ea; --bad:#d63b4e; } }
  :root[data-theme="light"] { --bg:#f2f5fa; --card:#fff; --text:#1b2433; --muted:#68758a; --line:#e2e8f2; --field:#f6f8fc; --accent:#2b74ea; --bad:#d63b4e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  h1 { margin:0 0 4px; font-size:20px; display:flex; align-items:center; gap:10px; }
  h1 i { width:10px; height:10px; border-radius:50%; background:#2fbf71; box-shadow:0 0 0 4px rgba(47,191,113,.18); }
  p { margin:0 0 18px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:var(--field); color:var(--text); font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { width:100%; margin-top:22px; padding:12px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .err { color:var(--bad); font-size:14px; margin-top:14px; min-height:1em; }
</style>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<form method="post" action="/login">
  <h1><i></i>VPN Dashboard</h1>
  <p>Статистика и состояние твоего VPN-сервера.</p>
  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  if (e) document.getElementById('err').textContent =
    e === 'wait' ? 'Слишком много попыток. Подожди 5 минут.' : 'Неверный логин или пароль.';
</script>
</body>
</html>
